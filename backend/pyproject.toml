[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safer5"
version = "0.1.0"
description = "Yerel kayıt kaybı ve tespit dayanıklılığı araştırma laboratuvarı"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic", "duckdb", "pyarrow", "scikit-learn", "networkx", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "pip-audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
